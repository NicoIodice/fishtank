# Fishtank — Release Pipeline
# Triggered on version tags (v*.*.*)
#
# Stages:
#   1. Build backend + run backend tests
#   2. Build frontend + run frontend tests
#   3. Build multi-arch Docker image (linux/amd64 + linux/arm64)
#   4. Push to GHCR for smoke tests
#   5. Cross-platform smoke tests (Linux, macOS ARM, macOS Intel, Windows)
#   6. Publish to Docker Hub (latest + version tag)

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # BUILD AND TEST
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Release version: $VERSION"

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/client/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Backend build and tests
      - name: Restore backend dependencies
        run: dotnet restore src/Fishtank.slnx

      - name: Build backend
        run: dotnet build src/Fishtank.slnx --no-restore

      - name: Run backend unit tests
        run: |
          dotnet test src/Fishtank.Api.UnitTests --no-build \
            --logger "trx;LogFileName=unit-test-results.trx" \
            --logger "console;verbosity=normal"

      - name: Run backend integration tests
        run: |
          dotnet test src/Fishtank.Api.IntegrationTests --no-build \
            --logger "trx;LogFileName=integration-test-results.trx" \
            --logger "console;verbosity=normal"

      # Frontend build and tests
      - name: Install frontend dependencies
        working-directory: src/client
        run: npm ci

      - name: Build frontend
        working-directory: src/client
        run: npm run build

      - name: Run frontend unit tests
        working-directory: src/client
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: '**/*.trx'
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # BUILD DOCKER IMAGE
  # ─────────────────────────────────────────────────────────────────────────────
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building Docker image for version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # CROSS-PLATFORM SMOKE TESTS
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test — ${{ matrix.config.name }}
    needs: build-image
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux
            os: ubuntu-latest
          - name: macOS-ARM64
            os: macos-latest
          - name: macOS-Intel
            os: macos-13
          - name: Windows
            os: windows-latest

    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image from GHCR
        run: docker pull ghcr.io/${{ github.repository }}:${{ needs.build-image.outputs.version }}

      - name: Start Fishtank container
        run: |
          docker run -d --name fishtank-smoke -p 5000:5000 \
            -e FISHTANK_JWT_SECRET=fishtank-smoke-test-release-pipeline-secret-32chars \
            ghcr.io/${{ github.repository }}:${{ needs.build-image.outputs.version }}

      - name: Wait for health endpoint (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          timeout 60 sh -c 'until curl -sf http://localhost:5000/health; do sleep 2; done' || \
          (echo "=== Container logs ==" && docker logs fishtank-smoke && exit 1)

      - name: Wait for health endpoint (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $timeout = 60
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:5000/health" -UseBasicParsing -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ Health check passed"
                exit 0
              }
            } catch {
              Write-Host "Waiting for health... ($elapsed/$timeout seconds)"
            }
            Start-Sleep -Seconds 2
            $elapsed += 2
          }
          Write-Host "❌ Health check failed after $timeout seconds"
          Write-Host "=== Container logs ==="
          docker logs fishtank-smoke
          exit 1

      - name: Assert health response
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            response=$(curl -s http://localhost:5000/health)
          else
            response=$(curl -s http://localhost:5000/health)
          fi
          echo "Health response: $response"
          echo "$response" | grep -qi "healthy" || (echo "❌ Health check response invalid" && exit 1)

      - name: Stop container
        if: always()
        run: |
          docker stop fishtank-smoke || true
          docker rm fishtank-smoke || true

  # ─────────────────────────────────────────────────────────────────────────────
  # PUBLISH TO DOCKER HUB
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to Docker Hub
    needs: [build-image, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push multi-arch manifest to Docker Hub
        run: |
          docker buildx imagetools create \
            --tag nicoiodice/fishtank:${{ needs.build-image.outputs.version }} \
            --tag nicoiodice/fishtank:latest \
            ghcr.io/${{ github.repository_owner }}/fishtank:${{ needs.build-image.outputs.version }}

      - name: Summary
        run: |
          echo "## 🎉 Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build-image.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Hub:** https://hub.docker.com/r/nicoiodice/fishtank" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`nicoiodice/fishtank:${{ needs.build-image.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`nicoiodice/fishtank:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
